# Local/single-server deployment. Put an HTTPS reverse proxy (see docs/DEPLOYMENT.md) in front of "web".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    # No "ports:" on purpose: PostgreSQL is reachable only inside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NETCARE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NETCARE_STORAGE_DIR: /app/storage
    # Uploaded documents. Back this up together with the database (scripts/backup.sh does both).
    volumes: [docstore:/app/storage]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    restart: unless-stopped
    # NETCARE_BIND=0.0.0.0 lets other PCs on the shop network open the app; the default is this machine only.
    ports: ["${NETCARE_BIND:-127.0.0.1}:${NETCARE_PORT:-8080}:80"]
    depends_on: [backend]

volumes:
  pgdata:
  docstore:
