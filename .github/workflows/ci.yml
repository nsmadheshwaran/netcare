name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes app tests ../agent ../organizer
      - run: python -m pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: netcare, POSTGRES_PASSWORD: netcare, POSTGRES_DB: netcare_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netcare" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NETCARE_TEST_DATABASE_URL: postgresql+psycopg://netcare:netcare@localhost:5432/netcare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      # Migrations up, down to nothing and up again, then the full suite on PostgreSQL (row locks, constraints).
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images and nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netcare-backend backend
      - run: docker build -t netcare-web frontend
      # nginx resolves "backend" when testing the config, so point it at localhost for the check.
      - run: docker run --rm --add-host backend:127.0.0.1 netcare-web nginx -t

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: |
          npm ci
          npm i --no-save @playwright/test@1.49.1
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }
