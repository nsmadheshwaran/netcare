# Rate limits (this file is included inside nginx's http block, so zones can be declared here).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agent:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    client_max_body_size 16m;  # document uploads are capped at 15 MB by the API
    root /usr/share/nginx/html;
    server_tokens off;

    # If an HTTPS proxy runs in front of this container, trust its address here so $remote_addr is the
    # real client, e.g.:  set_real_ip_from 172.16.0.0/12;  real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app loads only its own scripts; charts use inline styles; PDFs and downloads open as blob: URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach the API, or it could fake
        # its address (login rate limit, audit log).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/agent/ {
        limit_req zone=agent burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(health|ready)$ { proxy_pass http://backend:8000; }
    # "expires", not add_header: an add_header inside a location would drop the security headers above.
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri /index.html; }
}
